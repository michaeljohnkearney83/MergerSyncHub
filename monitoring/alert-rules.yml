# Alerts a third-line support team would actually be paged for. They are about outcomes
# (is data flowing, is it correct) rather than causes (CPU, memory), which keeps them few.
# No Alertmanager is wired up in this demo: see them firing at http://localhost:9090/alerts.
groups:
  - name: synchub
    rules:
      - alert: SyncStale
        # Neither a success nor a "succeeded with errors" run for 10 minutes (the interval is 1 minute).
        expr: synchub_sync_time_since_success_seconds > 600
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.source }} has not synced for {{ $value | humanizeDuration }}"
          description: "Check the worker logs in Grafana (Loki) for this source; the watermark is not moving."

      - alert: SyncRunsFailing
        expr: sum by (source) (increase(synchub_sync_runs_total{outcome="Failed"}[15m])) >= 3
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.source }}: {{ $value }} failed sync runs in 15 minutes"

      - alert: HighRejectionRate
        # More than 5% of records read are being dead-lettered.
        expr: |
          sum by (source) (rate(synchub_records_rejected_total[15m]))
            / sum by (source) (rate(synchub_records_read_total[15m])) > 0.05
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.source }}: {{ $value | humanizePercentage }} of records rejected"
          description: "Look at the dead letters in the support dashboard, grouped by error type."

      - alert: SyncWorkerMissing
        # SyncStale needs the series to exist. If the worker process is gone (the collector drops its
        # series after 5 minutes) there is nothing to compare, so alert on the absence itself.
        expr: absent(synchub_sync_time_since_success_seconds)
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "The SyncHub worker is not reporting"
          description: "Check the worker process is running and its logs in Loki for a start-up failure."

      - alert: CycleStepFailing
        # Catches failures outside a sync run: replay, duplicate detection, reporting refresh,
        # old-data purge, health snapshot, and SQL being down before a run can even start.
        expr: sum by (step) (increase(synchub_cycle_step_failures_total[15m])) >= 3
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Step '{{ $labels.step }}' failed {{ $value }} times in 15 minutes"
          description: "LogQL: {service_name=\"SyncHub.Worker\"} | severity_text=\"Error\""

      - alert: SyncRunStuck
        expr: sum by (source, run_type) (synchub_sync_stuck_runs) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.source }}: a {{ $labels.run_type }} run has been 'Running' for 30+ minutes"
          description: "The worker probably died mid-run. Check ops.SyncRun and the worker logs for its CorrelationId."

      - alert: ReconciliationInvestigate
        # abs(): deletes in the source aren't handled, so Unexplained can be negative too.
        # for: 15m because SourceTotal is read at the start of a run and can briefly disagree.
        expr: abs(synchub_reconciliation_unexplained) > 0
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.source }} {{ $labels.entity }}: {{ $value }} record(s) unexplained"
          description: "The support dashboard's reconciliation shows Investigate for this source and entity."

      - alert: DeadLettersAgeing
        expr: max by (source) (synchub_deadletters_oldest_open_age_seconds) > 86400
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.source }}: oldest open dead letter is {{ $value | humanizeDuration }} old"
          description: "Nobody has worked the exception queue for a day. Fix, replay or ignore in the support dashboard."
