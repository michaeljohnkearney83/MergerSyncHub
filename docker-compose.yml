# Optional: run SQL Server in Docker instead of (or alongside) a local install.
# Exposed on 14333 so it does not clash with a local SQL Server on 1433.
#
# The sa password comes from a .env file next to this one (Compose reads it automatically).
# .env is excluded from Git: copy .env.example to .env and choose a password first.
# SQL Server only uses it when the data volume is first created; changing it later
# means resetting the volume (docker compose down -v), which deletes the data.
#
# The monitoring stack (collector, Prometheus, Loki, Grafana) is in the "monitoring" profile,
# so `docker compose up -d` still starts only SQL Server. Start everything with:
#   docker compose --profile monitoring up -d
#
# How telemetry flows:
#   .NET services --OTLP--> OpenTelemetry Collector --+--> Prometheus (metrics, scraped from :8889)
#                                                      +--> Loki (logs, pushed over OTLP/HTTP)
#   Grafana reads both, with the data sources and the dashboard provisioned from ./monitoring.
#   React apps --Faro--> Grafana Alloy (:12347) --> Loki (browser errors, failed API calls, web vitals)
#
# Host ports are offset (14317/14318, 3033) because 4317/4318/3000 are often taken by other stacks.
#
# The application itself (four .NET services, two React apps and a one-off database setup) is in
# the "app" profile, built from docker/dotnet.Dockerfile and docker/web.Dockerfile:
#   docker compose --profile app --profile monitoring up -d --build
# It publishes the same host ports as `dotnet run` / `npm run dev`, so stop those first.
# Day-to-day development stays outside Docker (faster edit-run loop); see README step 3.

# Naming: <area>-<kind>, so each API sits next to its web front end in `docker ps`:
#   directory-api / directory-web, support-api / support-web, firmb-api, sync-worker, db-init.
# Service names are also the hostnames other containers use (http://directory-api:8080).
# Image names stay as they were and the .NET project names are unchanged.

# Settings shared by the .NET services. Connection strings use the "sql" service name and the
# container port; the sa login is fine for a local demo (a real deployment gets one login per app).
x-dotnet: &dotnet
  restart: unless-stopped
  profiles: ["app"]
  depends_on:
    db-init:
      condition: service_completed_successfully

x-otel: &otel
  # Telemetry goes to the collector if the monitoring profile is running; if it isn't, the exporter
  # gives up quietly and the services carry on.
  OpenTelemetry__OtlpEndpoint: "http://otel-collector:4317"

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: synchub-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
      MSSQL_PID: "Developer"
    ports:
      - "14333:1433"
    volumes:
      - synchub-sql:/var/opt/mssql
    healthcheck:
      # db-init and the services wait for this rather than racing SQL Server's start-up.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ---------------------------------------------------------------- application ("app" profile)

  db-init:
    # Same image as SQL Server: it already contains sqlcmd, so there's no extra image to pull.
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: synchub-db-init
    profiles: ["app"]
    entrypoint: ["/bin/bash", "/db-init.sh"]
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    volumes:
      - ./database:/scripts:ro
      - ./docker/db-init.sh:/db-init.sh:ro
    depends_on:
      sql:
        condition: service_healthy

  directory-api:
    <<: *dotnet
    build:
      context: .
      dockerfile: docker/dotnet.Dockerfile
      args: { GROUP: Mocks, PROJECT: CorpDirectory.Api }
    image: synchub/corp-directory
    container_name: synchub-directory-api
    environment:
      <<: *otel
      ConnectionStrings__Directory: "Server=sql,1433;Database=CorpDirectory;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Application Name=CorpDirectory.Api"
      # Tokens name the address the browser uses, not the container name.
      Directory__Issuer: "http://localhost:5090"
      Directory__SigningKeyPath: "/keys/signing-key.pem"
    volumes:
      - synchub-directory-keys:/keys      # keep the signing key, or every restart signs everyone out
    ports:
      - "5090:8080"

  firmb-api:
    <<: *dotnet
    build:
      context: .
      dockerfile: docker/dotnet.Dockerfile
      args: { GROUP: Mocks, PROJECT: FirmB.MockApi }
    image: synchub/firmb-mock
    container_name: synchub-firmb-api
    depends_on: {}
    environment:
      <<: *otel
    ports:
      - "5070:8080"

  sync-worker:
    <<: *dotnet
    build:
      context: .
      dockerfile: docker/dotnet.Dockerfile
      args:
        GROUP: Services
        PROJECT: SyncHub.Worker
        RUNTIME_IMAGE: mcr.microsoft.com/dotnet/runtime:10.0
    image: synchub/worker
    container_name: synchub-sync-worker
    depends_on:
      db-init:
        condition: service_completed_successfully
      firmb-api:
        condition: service_started
    environment:
      <<: *otel
      ConnectionStrings__SyncHub: "Server=sql,1433;Database=SyncHub;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Application Name=SyncHub.Worker"
      ConnectionStrings__FirmA: "Server=sql,1433;Database=FirmA_Legacy;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;ApplicationIntent=ReadOnly;Application Name=SyncHub.Worker"
      FirmB__BaseUrl: "http://firmb-api:8080/"

  support-api:
    <<: *dotnet
    build:
      context: .
      dockerfile: docker/dotnet.Dockerfile
      args: { GROUP: Services, PROJECT: SyncHub.SupportApi }
    image: synchub/support-api
    container_name: synchub-support-api
    depends_on:
      db-init:
        condition: service_completed_successfully
      directory-api:
        condition: service_started
    environment:
      <<: *otel
      ConnectionStrings__SyncHub: "Server=sql,1433;Database=SyncHub;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Application Name=SyncHub.SupportApi"
      # Accept tokens issued as http://localhost:5090 (what the browser signed in to), but fetch the
      # signing keys from the directory's container address: inside Docker, localhost is this container.
      Auth__Authority: "http://localhost:5090"
      Auth__MetadataAddress: "http://directory-api:8080/.well-known/openid-configuration"
    ports:
      - "5081:8080"

  support-web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        APP: dashboard
        VITE_API_URL: "http://localhost:5081"
        VITE_DIRECTORY_URL: "http://localhost:5090"
        VITE_FARO_URL: "http://localhost:12347/collect"
    image: synchub/dashboard
    container_name: synchub-support-web
    profiles: ["app"]
    restart: unless-stopped
    ports:
      - "5173:80"

  directory-web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        APP: directory-admin
        VITE_DIRECTORY_URL: "http://localhost:5090"
        VITE_FARO_URL: "http://localhost:12347/collect"
    image: synchub/directory-admin
    container_name: synchub-directory-web
    profiles: ["app"]
    restart: unless-stopped
    ports:
      - "5174:80"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.0
    container_name: synchub-otel-collector
    profiles: ["monitoring"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./monitoring/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "14317:4317"   # OTLP gRPC (what the .NET services use)
      - "14318:4318"   # OTLP HTTP
    depends_on:
      - loki

  alloy:
    # Receives browser telemetry (Grafana Faro) from the two React apps and forwards it to Loki.
    image: grafana/alloy:v1.22.0
    container_name: synchub-alloy
    profiles: ["monitoring"]
    command: ["run", "/etc/alloy/config.alloy", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - ./monitoring/alloy.alloy:/etc/alloy/config.alloy:ro
    ports:
      - "12347:12347"   # Faro collector endpoint (http://localhost:12347/collect)
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: synchub-prometheus
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - synchub-prometheus:/prometheus
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.5.0
    container_name: synchub-loki
    profiles: ["monitoring"]
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./monitoring/loki.yaml:/etc/loki/config.yaml:ro
      - synchub-loki:/loki
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:12.1.0
    container_name: synchub-grafana
    profiles: ["monitoring"]
    environment:
      # Local demo only: anonymous viewers, admin/admin for editing.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/synchub.json"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - synchub-grafana:/var/lib/grafana
    ports:
      - "3033:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  synchub-sql:
  synchub-directory-keys:
  synchub-prometheus:
  synchub-loki:
  synchub-grafana:
